name: CI/CD Flask Judol Detector

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          echo "✅ Dependencies installed"

      - name: Test Flask App (lint check)
        run: |
          python -m py_compile app/app.py || exit 1
          echo "✅ App compiled successfully"

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build dan Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/judol-detector-be:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke Server (via SSH)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Mulai proses deploy di server $(hostname)"

            # === Pastikan Docker terinstall ===
            if ! command -v docker &> /dev/null
            then
              echo "🐋 Docker belum terinstall, menginstall..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker $USER
              echo "✅ Docker berhasil diinstall"
            else
              echo "✅ Docker sudah terinstall"
            fi

            # === Pastikan Docker Compose juga terinstall ===
            if ! command -v docker-compose &> /dev/null
            then
              echo "🧩 Docker Compose belum terinstall, menginstall..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              echo "✅ Docker Compose berhasil diinstall"
            else
              echo "✅ Docker Compose sudah terinstall"
            fi

            # === Pull dan jalankan container terbaru ===
            docker pull ghcr.io/${{ github.repository_owner }}/judol-detector-be:latest
            docker stop judol-detector-be || true
            docker rm judol-detector-be || true
            docker run -d \
              --name judol-detector-be \
              -p 8080:8080 \
              ghcr.io/${{ github.repository_owner }}/judol-detector-be:latest

            echo "✅ Deployment selesai!"
